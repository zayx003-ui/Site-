 const nd=per[6].length?7:6,W=per.slice(0,nd),all=W.flat();
 const f=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'}),td=iso(new Date());
 let h=up()+'<div class="bar"><button id="pv" aria-label="Semaine précédente">‹</button><h2>Semaine du '+f(days[0])+' au '+f(days[nd-1])+'</h2><button id="td">Aujourd’hui</button><button id="nx" aria-label="Semaine suivante">›</button></div>';
 if(!all.length){$('#p1').innerHTML=h+'<div class="empty">Pas de cours cette semaine.</div>';nav();return}
 const lo=Math.min(8,Math.floor(Math.min(...all.map(e=>e.a)))),hi=Math.max(18,Math.ceil(Math.max(...all.map(e=>e.b)))),hrs=hi-lo;
 if(sel==null||sel>=nd)sel=Math.max(0,days.findIndex(d=>iso(d)===td)<nd?days.findIndex(d=>iso(d)===td):-1);
 if(sel<0||(!W[sel].length&&days.findIndex(d=>iso(d)===td)<0))sel=Math.max(0,W.findIndex(x=>x.length));
 h+='<div class="strip">'+W.map((L,i)=>'<button class="dp'+(i===sel?' on':'')+'" data-d="'+i+'"><small>'+days[i].toLocaleDateString('fr-FR',{weekday:'short'})+'</small><b>'+days[i].getDate()+'</b><i class="'+(L.length?'':'z')+'"></i></button>').join('')+'</div>';
 h+='<div class="wk" style="--nd:'+nd+';--hrs:'+hrs+'"><div class="gut">'+[...Array(hrs)].map((_,k)=>'<span style="--k:'+k+'">'+(lo+k)+'h</span>').join('')+'</div>';
 let q=0;const now=new Date(),nh=now.getHours()+now.getMinutes()/60;
 W.forEach((L,i)=>{h+='<div class="col'+(i===sel?' on':'')+(iso(days[i])===td?' today':'')+'"><h3>'+days[i].toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})+'</h3><div class="tl">';
  lay(L).forEach(e=>{const k=kind(e.t),m=e.t.match(/^(R3\.\d\d|SAE ?3\.\d+)\s*-\s*(.*)$/);
   h+='<article class="ev k-'+k+(k==='EX'?' ex':'')+'" style="--t:'+(e.a-lo)+';--d:'+(e.b-e.a)+';--l:'+e.l+';--n:'+e.n+';--i:'+(q++)+'"><div class="tm">'+e.s.slice(11)+' – '+e.e.slice(11)+'</div><div class="t">'+esc(m?m[2]:e.t)+'</div><div class="m">'+esc([m?m[1]:'',e.r,e.p].filter(Boolean).join(' · '))+'</div></article>'});
  if(iso(days[i])===td&&nh>lo&&nh<hi)h+='<div class="now" style="top:calc('+(nh-lo)+'*var(--ph))"></div>';
  h+='</div></div>'});
 h+='</div><div class="lg">'+Object.keys(lab).map(k=>'<span class="k-'+k+'">'+lab[k]+'</span>').join('')+'</div>';
 $('#p1').innerHTML=h;nav();
 document.querySelectorAll('.dp').forEach(b=>b.onclick=()=>{sel=+b.dataset.d;plan()});
}
function nav(){const g=v=>{wk.setDate(wk.getDate()+v);sel=null;plan()};
 $('#pv').onclick=()=>{if(wk>first)g(-7)};$('#nx').onclick=()=>{if(wk<last)g(7)};
 $('#td').onclick=()=>{wk=mon(new Date());if(wk<first)wk=first;if(wk>last)wk=last;sel=null;plan()}}
const moy=r=>{let s=0,p=0;r.e.forEach(e=>{if(e.v!=null){s+=e.v*e.p;p+=e.p}});return p?s/p:null};
const gb=v=>'<div class="gw"><div class="gb"><i style="--w:'+(v||0)*5+'%"></i></div><s></s></div>';
const rule=(v,s)=>'<div class="ru"><div class="tr"><i class="bd" style="left:'+s[1]*5+'%;width:'+Math.max(.6,(s[0]-s[1])*5)+'%"></i></div><u style="left:'+s[2]*5+'%"></u>'+(v==null?'':'<em style="left:'+v*5+'%">vous</em>')+[0,5,10,15,20].map(n=>'<s style="left:'+n*5+'%">'+n+'</s>').join('')+'</div>';
const rw=(l,p,v,s,main)=>{const c=s?' clk" tabindex="0" role="button" aria-expanded="false':'';
 return '<div class="row'+(v==null?' p':'')+c+'"><div class="rt"><span>'+l+(p==null?'':' <i>('+String(p).replace('.',',')+' %)</i>')+'</span>'+(v==null?'<em>à venir</em>':'<b>'+fr(v)+'<small> /20</small></b>')+'</div>'+(v==null?'':gb(v))+'</div>'+(s?'<div class="st" hidden><div class="ch"><span class="g">Meilleure note <b>'+fr(s[0])+'</b></span><span class="r">Pire note <b>'+fr(s[1])+'</b></span><span class="b">Moyenne de la promo <b>'+fr(s[2])+'</b></span></div>'+rule(v,s)+'</div>':'')};
document.addEventListener('click',e=>{const r=e.target.closest('.clk');if(r){const s=r.nextElementSibling;s.hidden=!s.hidden;r.setAttribute('aria-expanded',!s.hidden)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('clk')){e.preventDefault();e.target.click()}});
function notes(){
 const ue=D.ue.map(u=>{let s=0,c=0;D.res.forEach(r=>{const m=moy(r),k=r.c[u];if(m!=null&&k){s+=m*k;c+=k}});return c?s/c:null});
 let h='<div class="ues">'+D.ue.map((u,i)=>'<div class="ue" style="--n:'+i+'"><div class="un">'+u+' · moyenne provisoire</div><div class="uv"><b data-v="'+(ue[i]??'')+'">'+(ue[i]==null?'–':fr(ue[i]))+'</b><span>/20</span></div>'+gb(ue[i])+'<div class="sc"><span>0</span><span>10</span><span>20</span></div></div>').join('')+'</div>';
 h+=bilan();h+=D.res.map(r=>{const m=moy(r);return '<details'+(m==null?'':' open')+'><summary><span>'+r.n+'</span>'+(m==null?'<span class="rv off">à venir</span>':'<span class="rv">'+fr(m)+'<small> /20</small></span>')+'</summary>'+r.e.map(e=>rw(e.n,e.p,e.v,e.s)).join('')+(m==null?'':rw('<b>Moyenne provisoire</b>',null,m,r.ms))+'</details>'}).join('');
 h+='<p class="note">Appuyez sur une note pour la comparer à la promo : meilleure note, pire note et moyenne. Les moyennes ne comptent que les notes déjà obtenues ; un 0,00 peut correspondre à une absence. Le trait au milieu des barres marque 10/20.</p>';
 $('#p2').innerHTML=h;
}
const nm=e=>{const m=e.t.match(/^(R3\.\d\d|SAE ?3\.\d+)\s*-\s*(.*)$/);return m?m[1]+' · '+m[2]:e.t};
function up(){const now=new Date(),E=D.ev.filter(e=>!/tiers/i.test(e.t)),day=s=>Math.round((new Date(s.slice(0,10)+'T12:00')-new Date(iso(now)+'T12:00'))/864e5),dh=m=>m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'):m+' min';
 const cur=E.find(e=>new Date(e.e)>now);let c='';
 if(cur){const ms=new Date(cur.s)-now,run=ms<=0,d=day(cur.s),m=Math.round((run?new Date(cur.e)-now:ms)/6e4);
  const w=run?'encore '+dh(m):d>=1?(d===1?'demain':'dans '+d+' jours')+' · '+cur.s.slice(11):'dans '+dh(m);
  c='<div class="uc k-'+kind(cur.t)+'"><div class="ul">'+(run?'En cours':'Prochain cours')+'</div><div class="ub">'+w+'</div><div class="ut">'+esc(nm(cur))+'</div><div class="um">'+esc([cur.s.slice(11)+' – '+cur.e.slice(11),cur.r,cur.p].filter(Boolean).join(' · '))+'</div></div>'}
 const X=E.filter(e=>kind(e.t)==='EX'&&new Date(e.e)>now).slice(0,3);
 const x=X.length?'<div class="uc k-EX"><div class="ul">Prochains examens</div>'+X.map(e=>{const d=day(e.s);return '<div class="xr"><span>'+esc(nm(e))+'<i>'+new Date(e.s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' · '+e.s.slice(11)+'</i></span><b>'+(d<=0?'aujourd’hui':d===1?'demain':'J-'+d)+'</b></div>'}).join('')+'</div>':'';
 return c||x?'<div class="up">'+c+x+'</div>':''}
function bilan(){const L=[];let n=0,t=0;D.res.forEach(r=>{const c=(r.n.match(/^(R3\.\d\d|SAE 3\.\d)/)||[''])[0];r.e.forEach(e=>{t++;if(e.v!=null)n++;if(e.v!=null&&e.s)L.push({n:c+' · '+e.n,v:e.v,m:e.s[2],d:e.v-e.s[2]})})});
 L.sort((a,b)=>b.d-a.d);const mx=Math.max(1,...L.map(x=>Math.abs(x.d))),pos=L.filter(x=>x.d>=0).length,sg=d=>(d>=0?'+':'−')+fr(Math.abs(d));
 return '<section class="card"><h2>Bilan du semestre</h2><div class="pg"><span>Évaluations notées</span><b>'+n+' / '+t+'</b></div><div class="gb"><i style="--w:'+(t?n/t*100:0)+'%"></i></div>'+(L.length?'<p class="bs">Au-dessus de la moyenne de la promo sur <b>'+pos+'</b> évaluation'+(pos>1?'s':'')+' sur '+L.length+'.</p>'+L.map(x=>'<div class="bl"><div class="bt"><span>'+esc(x.n)+'</span><i>vous '+fr(x.v)+' · promo '+fr(x.m)+'</i></div><div class="dv"><i class="'+(x.d>=0?'po':'ne')+'" style="--w:'+Math.abs(x.d)/mx*50+'%"></i></div><b class="'+(x.d>=0?'po':'ne')+'">'+sg(x.d)+'</b></div>').join(''):'')+'</section>'}
function sim(){
 $('#p3').innerHTML='<section class="card"><h2>Simulateur</h2><p class="bs">Choisissez une ressource et un objectif : je calcule la note moyenne qu’il faut sur les évaluations restantes.</p><label for="sr">Ressource ou SAE</label><select id="sr">'+D.res.map((r,i)=>'<option value="'+i+'">'+esc(r.n)+'</option>').join('')+'</select><label for="sg">Objectif de moyenne (/20)</label><input id="sg" type="number" min="0" max="20" step="0.5" value="10" inputmode="decimal"><div id="sl"></div><div class="res" id="so"></div></section>';
 const calc=()=>{const r=D.res[+$('#sr').value],g=parseFloat($('#sg').value),pen=r.e.filter(e=>e.v==null),en=r.e.filter(e=>e.v!=null);
  const S=en.reduce((a,e)=>a+e.v*e.p,0),Pe=en.reduce((a,e)=>a+e.p,0),Pp=pen.reduce((a,e)=>a+e.p,0);let o='';
  if(!pen.length)o='Toutes les évaluations sont notées : moyenne <b>'+fr(S/Pe)+'</b>/20.';
  else if(isNaN(g))o='Entrez un objectif.';
  else{const need=(g*(Pe+Pp)-S)/Pp;
   o=need<=0?'Objectif de '+fr(g)+' déjà atteint, quelle que soit la suite.':need>20?'Objectif de '+fr(g)+' hors de portée : il faudrait <b>'+fr(need)+'</b>/20 sur le reste.':'Pour finir à '+fr(g)+'/20, il faut en moyenne <b>'+fr(need)+'</b>/20 sur '+(pen.length>1?'les évaluations restantes':'l’évaluation restante')+'.';
   const hy=[...document.querySelectorAll('#sl input')].map((x,k)=>({v:parseFloat(x.value),p:pen[k].p})).filter(x=>!isNaN(x.v));
   if(hy.length){const P=Pe+hy.reduce((a,x)=>a+x.p,0),T=S+hy.reduce((a,x)=>a+x.v*x.p,0);o+='<br>Avec ces hypothèses, moyenne projetée : <b>'+fr(T/P)+'</b>/20.'}}
  $('#so').innerHTML=o};
 const draw=()=>{const r=D.res[+$('#sr').value];$('#sl').innerHTML=r.e.filter(e=>e.v==null).map((e,k)=>'<div class="sr"><span>'+esc(e.n)+' <i>('+String(e.p).replace('.',',')+' %)</i></span><input type="number" min="0" max="20" step="0.25" placeholder="hypothèse" inputmode="decimal"></div>').join('');calc()};
 $('#sr').onchange=draw;$('#sg').oninput=calc;$('#sl').oninput=calc;draw()}
function anim(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.uv b[data-v]').forEach(b=>{const v=parseFloat(b.dataset.v);if(isNaN(v))return;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1100);b.textContent=fr(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
plan();notes();
[['t1','p1'],['t2','p2'],['t3','p3']].forEach(([t,p])=>$('#'+t).onclick=()=>{['t1','t2','t3'].forEach(x=>$('#'+x).setAttribute('aria-selected',x===t));['p1','p2','p3'].forEach(x=>$('#'+x).hidden=x!==p);if(t==='t2')anim()});
sim();

}
</script></body></html>
